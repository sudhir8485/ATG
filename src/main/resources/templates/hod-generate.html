<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="hod-layout :: head('Generate Timetable · HOD', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell{display:flex;flex-direction:column;gap:16px;}
            .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 10px 24px -16px rgba(0,0,0,0.18);}
            .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer;}
            .btn.primary{background:#4f46e5;color:#fff;box-shadow:0 12px 24px rgba(79,70,229,0.25);}
            .btn.secondary{background:#e5e7eb;color:#111827;text-decoration:none;}
            table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px -16px rgba(0,0,0,0.18);}
            th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e5e7eb;}
            th{background:#f0f2f7;color:#475569;font-size:13px;text-transform:uppercase;}
        </style>
    </th:block>
</head>
<body th:replace="hod-layout :: shell('generate', 'Generate Timetable', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div>
        <h2 style="font-size:22px;margin-bottom:6px;">Generate Timetable</h2>
        <p style="color:#64748b;">Run the generator for your department.</p>
    </div>

    <div class="card">
        <form action="/hod-generate/run" method="post" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <button class="btn primary" type="submit"><i class="fas fa-magic"></i> Generate Now</button>
            <a class="btn secondary" href="/hod-timetable"><i class="fas fa-table"></i> View Timetable</a>
        </form>
        <div style="margin-top:12px;color:#4b5563;">
            <div th:if="${lastCount != null}" th:text="'Existing entries before run: ' + ${lastCount}"></div>
            <div th:if="${placedCount != null}" th:text="'Placed ' + ${placedCount} + ' of ' + ${requestedCount} + ' sessions'"></div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 10px 0;">Generated Timetable</h3>
        <table>
            <thead><tr><th>Day</th><th>Class</th><th>Division</th><th>Subject</th><th>Faculty</th><th>Time</th><th>Room</th></tr></thead>
            <tbody>
            <tr th:each="t : ${timetableList}">
                <td th:text="${t.day}"></td>
                <td th:text="${t.className}"></td>
                <td th:text="${t.division}"></td>
                <td th:text="${t.subject}"></td>
                <td th:text="${t.faculty}"></td>
                <td th:text="${t.timeSlot}"></td>
                <td th:text="${t.room}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(timetableList)}">
                <td colspan="7" style="text-align:center;padding:12px;color:#6b7280;">No timetable yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
