<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatic Timetable · login</title>

  <!-- Poppins modern font + fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 (free) for subtle icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b0f2a 0%, #1a1f40 60%, #2a1e4a 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* abstract decorative blobs */
    body::before {
      content: '';
      position: absolute;
      width: 28rem;
      height: 28rem;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.25) 0%, transparent 70%);
      top: -8rem;
      right: -8rem;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      width: 22rem;
      height: 22rem;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.2) 0%, transparent 70%);
      bottom: -5rem;
      left: -5rem;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    /* main card – glassmorphism + refined depth */
    .login-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      width: 440px;
      max-width: 100%;
      padding: 2.5rem 2.2rem 2.2rem;
      border-radius: 2.5rem;
      box-shadow: 
        0 30px 60px -10px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.2) inset,
        0 10px 30px -5px rgba(79, 70, 229, 0.3);
      transition: transform 0.25s ease;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .login-container:hover {
      transform: scale(1.01);
    }

    /* brand section */
    .project-title {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .project-title i {
      color: #4f46e5;
      font-size: 2rem;
      background: rgba(79, 70, 229, 0.15);
      padding: 0.45rem;
      border-radius: 1.2rem;
    }

    .project-sub {
      font-size: 0.9rem;
      font-weight: 500;
      color: #4b5563;
      letter-spacing: 0.4px;
      margin-bottom: 1.8rem;
      text-transform: uppercase;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 1rem;
      display: inline-block;
      width: auto;
      padding-left: 1.2rem;
      padding-right: 1.2rem;
      background: rgba(255,255,255,0.5);
      border-radius: 40px;
      backdrop-filter: blur(2px);
    }

    /* input groups with icon */
    .input-group {
      position: relative;
      width: 100%;
      margin: 0.75rem 0 0.5rem;
    }

    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      font-size: 1.1rem;
      transition: color 0.2s;
      pointer-events: none;
      z-index: 2;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.9rem;
      border: 2px solid #e2e8f0;
      background: white;
      border-radius: 60px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1f2937;
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
    }

    /* select custom arrow */
    .input-group.select-group::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      pointer-events: none;
      font-size: 0.8rem;
      z-index: 3;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      background-color: #fafaff;
    }

    .input-group input:focus + i,
    .input-group select:focus + i {
      color: #7c3aed;
    }

    /* separate spacing for select (since icon is user icon) */
    .input-group select {
      padding-left: 2.9rem;
      background-image: linear-gradient(45deg, transparent 50%, gray 50%);
      background-position: calc(100% - 1.2rem) center;
      background-size: 10px 10px;
      background-repeat: no-repeat;
      background-image: none;  /* we use fontawesome arrow */
    }

    /* role icon specific adjustment */
    .fa-user-tie {
      font-size: 1.1rem;
    }

    /* stylish login button */
    .login-btn {
      width: 100%;
      padding: 0.9rem 1rem;
      background: linear-gradient(105deg, #4f46e5, #7c3aed, #a855f7);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 60px;
      margin: 1.5rem 0 1.2rem;
      cursor: pointer;
      box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.6);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .login-btn i {
      font-size: 1.1rem;
      transition: transform 0.2s;
    }

    .login-btn:hover {
      background: linear-gradient(105deg, #4338ca, #6d28d9, #9333ea);
      box-shadow: 0 20px 30px -6px #4f46e5;
      transform: translateY(-2px);
    }

    .login-btn:hover i {
      transform: translateX(4px);
    }

    /* footer extra refined */
    .footer {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #5b6e8a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-top: 1px solid rgba(203, 213, 225, 0.6);
      padding-top: 1.2rem;
    }

    .footer i {
      color: #a78bfa;
      font-size: 0.8rem;
    }

    .footer span {
      font-weight: 600;
      color: #4f46e5;
    }

    /* small hint for better UX */
    .hint-text {
      font-size: 0.8rem;
      text-align: left;
      margin: 0.2rem 0 0 1rem;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .hint-text i {
      font-size: 0.7rem;
      color: #7c3aed;
    }

    /* demo roles badge (optional) – makes it look professional */
    .role-badge {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .role-badge span {
      background: #ede9fe;
      color: #4c1d95;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      border: 1px solid #c7d2fe;
    }

    /* responsive touch */
    @media (max-width: 460px) {
      .login-container {
        padding: 2rem 1.5rem;
      }
      .project-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<div class="login-container">

  <!-- title with icon -->
  <div class="project-title">
    <i class="fas fa-calendar-alt"></i> 
    Automatic Timetable
  </div>
  <div class="project-sub">
    <i class="fas fa-graduation-cap" style="margin-right: 4px;"></i> College Management System
  </div>

  <!-- Role badges (light visual hierarchy) -->
  <div class="role-badge">
    <span><i class="fas fa-user-shield"></i> ADMIN</span>
    <span><i class="fas fa-chalkboard-teacher"></i> HOD</span>
    <span><i class="fas fa-user"></i> FACULTY</span>
  </div>

  <!-- login form (thymeleaf ready) -->
  <form action="/login" method="post">

    <!-- Username / ID field -->
    <div class="input-group">
      <i class="fas fa-user"></i>
      <input type="text" name="username" placeholder="Email or HOD ID (set by admin)" required>
    </div>

    <!-- Password field -->
    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <!-- Role select with custom icon -->
    <div class="input-group select-group">
      <i class="fas fa-user-tie"></i>
      <select name="role" required>
        <option value="" disabled selected> – Select your role – </option>
        <option value="ADMIN">👑 Admin</option>
        <option value="HOD">📋 Head of Department</option>
        <option value="FACULTY">📚 Faculty</option>
      </select>
    </div>

    <!-- subtle hint (optional, for clarity) -->
    <div class="hint-text">
      <i class="fas fa-info-circle"></i> HOD: use the email/ID and password set in Admin › Add HOD
    </div>

    <!-- login button with icon -->
    <button type="submit" class="login-btn">
      <span>Sign in to dashboard</span>
      <i class="fas fa-arrow-right"></i>
    </button>

  </form>

  <!-- footer with copyright and dynamic year (2026 as requested) -->
  <div class="footer">
    <i class="far fa-copyright"></i>
    <span>2026</span> Timetable Generator · secure access
  </div>

  <!-- tiny decorative micro-interaction: just for delight -->
  <div style="margin-top: 0.6rem; font-size: 0.7rem; color: #9aa9b9;">
    <i class="fas fa-magic" style="opacity: 0.6;"></i> intelligent scheduling
  </div>

</div>

<!-- optional self-invoking script for live year (but we keep 2026 fixed) 
     no script needed, design is already attractive -->

</body>
</html>
