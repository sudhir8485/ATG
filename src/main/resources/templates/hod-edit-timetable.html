<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="hod-layout :: head('Edit Lecture · HOD', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell{display:flex;flex-direction:column;gap:16px;}
            .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 8px 22px -16px rgba(0,0,0,0.18);}
            .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
            .btn{padding:10px 14px;border-radius:10px;border:none;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;}
            .btn.secondary{background:#e5e7eb;color:#111827;text-decoration:none;text-align:center;display:inline-block;}
            select,input{padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;width:100%;}
        </style>
    </th:block>
</head>
<body th:replace="hod-layout :: shell('timetable', 'Edit Lecture', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div>
        <h2 style="font-size:22px;margin-bottom:6px;">Edit Lecture</h2>
    </div>

    <div class="card">
        <form th:action="@{/hod-timetable/update/{id}(id=${entry.id})}" method="post" class="form-grid">
            <input type="text" name="className" placeholder="Class" th:value="${entry.className}">
            <input type="text" name="division" placeholder="Division" th:value="${entry.division}">
            <input type="text" name="subject" placeholder="Subject" th:value="${entry.subject}">
            <input type="text" name="faculty" placeholder="Faculty" th:value="${entry.faculty}">
            <select name="timeslot">
                <option th:each="t : ${times}" th:value="${t.timeSlot}" th:text="${t.timeSlot}" th:selected="${t.timeSlot == entry.timeSlot}"></option>
            </select>
            <select name="room">
                <option th:each="r : ${rooms}" th:value="${r.room}" th:text="${r.room}" th:selected="${r.room == entry.room}"></option>
            </select>
            <div style="display:flex;gap:10px;align-items:center;">
                <button class="btn" type="submit">Save</button>
                <a class="btn secondary" href="/hod-timetable">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
