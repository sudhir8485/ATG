<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="hod-layout :: head('Swap Lectures · HOD', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell{display:flex;flex-direction:column;gap:16px;}
            .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 8px 22px -16px rgba(0,0,0,0.18);}
            select{padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;width:100%;}
            .btn{padding:10px 14px;border-radius:10px;border:none;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;}
            .btn.secondary{background:#e5e7eb;color:#111827;text-decoration:none;text-align:center;display:inline-block;}
            .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
        </style>
    </th:block>
</head>
<body th:replace="hod-layout :: shell('timetable', 'Swap Lectures', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div>
        <h2 style="font-size:22px;margin-bottom:6px;">Swap Lectures</h2>
    </div>

    <div class="card">
        <form action="/hod-timetable/swap" method="post" class="form-grid">
            <div>
                <label>First Lecture</label>
                <select name="firstId" required>
                    <option th:each="t : ${timetable}" th:value="${t.id}" th:text="${t.subject + ' - ' + t.timeSlot}"></option>
                </select>
            </div>
            <div>
                <label>Second Lecture</label>
                <select name="secondId" required>
                    <option th:each="t : ${timetable}" th:value="${t.id}" th:text="${t.subject + ' - ' + t.timeSlot}"></option>
                </select>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
                <button class="btn" type="submit">Swap</button>
                <a class="btn secondary" href="/hod-timetable">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
