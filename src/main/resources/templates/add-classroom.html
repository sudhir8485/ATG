<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin-layout :: head('Classroom Management · Admin', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell  { display:flex; flex-direction:column; gap:20px; }
            /* Balanced 2-col: form gets ~40%, list gets ~60% */
            .cr-grid     { display:grid; grid-template-columns:1fr 1.5fr; gap:20px; align-items:start; }
            @media(max-width:860px) { .cr-grid { grid-template-columns:1fr; } }
            .type-lab    { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; display:inline-block; }
            .type-room   { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; display:inline-block; }
        </style>
    </th:block>
</head>
<body th:replace="admin-layout :: shell('classrooms', 'Classroom Management', ~{::content})">
<section th:fragment="content" class="page-shell">

    <!-- Header -->
    <div class="pg-head">
        <h2><i class="fas fa-door-open" style="color:#4f46e5;"></i> Classroom Management</h2>
        <p>Add and manage classrooms and lab rooms used for scheduling.</p>
    </div>

    <!-- Flash -->
    <div th:if="${message}" th:class="${messageType == 'error'} ? 'flash-err' : 'flash-ok'">
        <span th:text="${message}"></span>
    </div>

    <!-- Stat cards -->
    <div class="stat-row">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-door-open"></i></div>
            <div class="stat-info">
                <div class="sv" th:text="${#lists.size(rooms)}">0</div>
                <div class="sl">Total Rooms</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-flask"></i></div>
            <div class="stat-info">
                <div class="sv" th:text="${labCount}">0</div>
                <div class="sl">Labs</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon amber"><i class="fas fa-chalkboard"></i></div>
            <div class="stat-info">
                <div class="sv" th:text="${classroomCount}">0</div>
                <div class="sl">Classrooms</div>
            </div>
        </div>
    </div>

    <!-- Two-column layout: form 40% | list 60% -->
    <div class="cr-grid">

        <!-- Form -->
        <div class="ds-card">
            <div class="ds-card-head">
                <i th:class="${isEdit} ? 'fas fa-edit' : 'fas fa-plus-circle'" style="color:#4f46e5;"></i>
                <span th:text="${isEdit} ? 'Edit Classroom' : 'Add Classroom'"></span>
            </div>

            <div th:if="${isEdit}" class="edit-banner">
                <i class="fas fa-info-circle"></i> Editing existing classroom — fields pre-filled.
            </div>

            <form th:action="${isEdit and classroom != null} ? @{/update-classroom/{id}(id=${classroom.id})} : @{/save-classroom}" method="post">
                <div class="fg">
                    <label>Room Name / Number *</label>
                    <input type="text" name="room" placeholder="e.g., IT-305, Lab WET-1" required
                           th:value="${classroom != null ? classroom.room : ''}">
                </div>
                <div class="fg">
                    <label>Capacity <span style="font-weight:400;text-transform:none;">(optional)</span></label>
                    <input type="number" name="capacity" min="1" placeholder="e.g., 60"
                           th:value="${classroom != null and classroom.capacity != null ? classroom.capacity : ''}">
                </div>
                <div class="fg">
                    <label>Room Type</label>
                    <select name="type">
                        <option value="" th:selected="${classroom == null or (classroom.type == null or classroom.type == '')}">Select type</option>
                        <option value="Classroom" th:selected="${classroom != null and (classroom.type == 'Classroom' or classroom.type == 'Lecture')}">Classroom</option>
                        <option value="Lab"       th:selected="${classroom != null and classroom.type == 'Lab'}">Laboratory</option>
                    </select>
                </div>
                <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
                    <button type="submit" class="btn-pri">
                        <i class="fas fa-save"></i>
                        <span th:text="${isEdit} ? 'Save Changes' : 'Add Classroom'"></span>
                    </button>
                    <button type="reset" class="btn-sec" th:if="${!isEdit}">Reset</button>
                    <a href="/add-classroom" class="btn-sec" th:if="${isEdit}">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>

        <!-- List -->
        <div class="ds-list">
            <div class="ds-list-head">
                <h4><i class="fas fa-list" style="color:#4f46e5;"></i> All Classrooms &amp; Lab Rooms</h4>
                <span class="count-tag" th:text="${#lists.size(rooms)} + ' total'">0</span>
            </div>
            <table>
                <thead>
                <tr>
                    <th>Room</th>
                    <th>Capacity</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rooms}">
                    <td style="font-weight:600;" th:text="${r.room}"></td>
                    <td style="font-size:12px;color:#64748b;" th:text="${r.capacity != null ? r.capacity : '—'}"></td>
                    <td>
                        <span th:if="${r.type == 'Lab'}"                                        class="type-lab">Lab</span>
                        <span th:if="${r.type == 'Classroom' or r.type == 'Lecture'}"           class="type-room">Classroom</span>
                        <span th:if="${r.type != 'Lab' and r.type != 'Classroom' and r.type != 'Lecture'}"
                              style="color:#94a3b8;font-size:12px;">—</span>
                    </td>
                    <td>
                        <div class="tbl-actions">
                            <a class="tbl-edit" th:href="@{/edit-classroom/{id}(id=${r.id})}">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a class="tbl-del" th:href="@{/delete-classroom/{id}(id=${r.id})}"
                               onclick="return confirm('Delete this classroom?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rooms)}">
                    <td colspan="4" style="text-align:center;padding:24px;color:#94a3b8;">No classrooms added yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
