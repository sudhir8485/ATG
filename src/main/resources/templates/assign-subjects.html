<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin-layout :: head('Assign Subjects · Admin', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell{display:flex;flex-direction:column;gap:18px;}
            .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.08);padding:18px;}
            table{width:100%;border-collapse:collapse;}
            th,td{padding:12px 10px;border-bottom:1px solid #e2e8f0;text-align:left;}
            th{background:#f8fafc;text-transform:uppercase;font-size:12px;letter-spacing:0.4px;color:#475569;}
            .btn{padding:8px 12px;border-radius:10px;border:none;background:#4f46e5;color:#fff;cursor:pointer;font-weight:700;}
            select{padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;}
        </style>
    </th:block>
</head>
<body th:replace="admin-layout :: shell('assign-subjects', 'Assign Subjects', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div class="page-header">
        <h2><i class="fas fa-link"></i> Assign Subjects to Faculty</h2>
        <p>Pick a faculty member for each subject.</p>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Subject</th>
                <th>Code</th>
                <th>Department</th>
                <th>Assigned Faculty</th>
                <th style="width:140px;">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${subjects}">
                <td th:text="${s.name}"></td>
                <td th:text="${s.code}"></td>
                <td th:text="${s.department}"></td>
                <td>
                    <form th:action="@{/assign-subjects/{id}(id=${s.id})}" method="post" style="display:flex;gap:8px;align-items:center;">
                        <select name="facultyName">
                            <option value="">-- Select --</option>
                            <option th:each="f : ${faculty}"
                                    th:value="${f.name}"
                                    th:text="${f.name}"
                                    th:selected="${s.faculty} != null ? (s.faculty == f.name) : false"></option>
                        </select>
                        <button type="submit" class="btn">Save</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(subjects)}">
                <td colspan="5" style="text-align:center;padding:12px;color:#6b7280;">No subjects found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
