<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin-layout :: head('Department Management · Admin', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            .page-header h2 {
                font-size: 26px;
                color: #1a2639;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .alert-success{
                background:#ecfdf3;
                color:#15803d;
                border:1px solid #bbf7d0;
            }
            .alert-error{
                background:#fef2f2;
                color:#b91c1c;
                border:1px solid #fecdd3;
            }

            .card {
                background: white;
                padding: 26px;
                max-width: 520px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                border: 1px solid #e2e8f0;
            }

            .card-header {
                margin-bottom: 20px;
            }

            .card-header h3 {
                color: #1a2639;
                font-size: 20px;
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 0;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
            }

            .input-wrapper {
                position: relative;
            }

            .input-wrapper i {
                position: absolute;
                left: 15px;
                top: 12px;
                color: #9aa1b5;
            }

            .page-shell input {
                padding-left: 42px;
            }

            .form-actions {
                display: flex;
                gap: 14px;
                margin-top: 10px;
                flex-wrap: wrap;
            }

            .btn-secondary {
                background: #7f8c8d;
                color: #fff;
            }

            .departments-list {
                background: white;
                border-radius: 16px;
                padding: 18px;
                border: 1px solid #e2e8f0;
            }

            .list-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
            }

            .action-link {
                margin-right: 10px;
                color: #3498db;
                text-decoration: none;
                font-weight: 600;
            }

            .action-delete {
                color: #e74c3c;
            }
        </style>
    </th:block>
</head>
<body th:replace="admin-layout :: shell('departments', 'Department Management', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div class="page-header">
        <h2><i class="fas fa-building"></i> Department Management</h2>
    </div>

    <div th:if="${message}" style="padding:12px 14px;border-radius:12px;font-weight:600;margin-top:-6px;"
         th:classappend="${messageType}=='success' ? ' alert-success' : ' alert-error'">
        <span th:text="${message}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>
                <i class="fas fa-plus-circle" th:if="${!isEdit}"></i>
                <i class="fas fa-edit" th:if="${isEdit}"></i>
                <span th:text="${isEdit} ? 'Edit Department' : 'Add New Department'"></span>
            </h3>
            <p th:text="${isEdit} ? 'Update and save changes' : 'Create a new department by filling the form'"></p>
        </div>

        <form th:action="${isEdit} ? @{/update-department/{id}(id=${department.id})} : @{/save-department}" method="post">
            <div class="form-group">
                <label><i class="fas fa-building"></i> Department Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-university"></i>
                    <input type="text" name="name" placeholder="Enter Department Name" required
                           th:value="${department != null} ? department.name : ''">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-code"></i> Department Code</label>
                <div class="input-wrapper">
                    <i class="fas fa-tag"></i>
                    <input type="text" name="code" placeholder="Enter Department Code"
                           th:value="${department != null} ? department.code : ''">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-user-tie"></i> Head of Department</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input list="hodList" name="hod" placeholder="Select or type HOD"
                           th:value="${department != null} ? department.hod : ''">
                    <datalist id="hodList">
                        <option th:each="h : ${hodList}" th:value="${h.name}"></option>
                    </datalist>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">
                    <i class="fas fa-save"></i>
                    <span th:text="${isEdit} ? 'Save Changes' : 'Create Department'"></span>
                </button>

                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>
            </div>
        </form>
    </div>

    <div class="departments-list">
        <div class="list-header">
            <h4><i class="fas fa-list"></i> Existing Departments</h4>
        </div>

        <table>
            <thead>
            <tr>
                <th>Department</th>
                <th>Code</th>
                <th>HOD</th>
                <th style="width:160px;">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="d : ${departments}">
                <td th:text="${d.name}"></td>
                <td th:text="${d.code}"></td>
                <td th:text="${d.hod}"></td>
                <td>
                    <a class="action-link" th:href="@{/edit-department/{id}(id=${d.id})}">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a class="action-link action-delete" th:href="@{/delete-department/{id}(id=${d.id})}"
                       onclick="return confirm('Delete this department?')">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
