<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin-layout :: head('Add Timetable Entry · Admin', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell { display:flex; flex-direction:column; gap:18px; }
            .card { background:#fff; padding:24px; border-radius:14px;
                    box-shadow:0 8px 22px rgba(0,0,0,0.08); border:1px solid #e2e8f0; }
            .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px 16px; }
            .form-group { display:flex; flex-direction:column; gap:6px; }
            .form-group label { font-size:11px; font-weight:700; color:#64748b;
                                text-transform:uppercase; letter-spacing:0.3px; }
            .form-group select, .form-group input {
                padding:9px 11px; border:1px solid #e2e8f0; border-radius:8px;
                font-size:13px; color:#1e293b; background:#f8fafc; width:100%; box-sizing:border-box; }
            .form-group select:focus, .form-group input:focus {
                outline:none; border-color:#4f46e5; background:#fff; }
            .hint { font-size:11px; color:#94a3b8; margin-top:2px; }
            .form-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; }
            .span-full { grid-column: 1 / -1; }
        </style>
    </th:block>
</head>
<body th:replace="admin-layout :: shell('grid', 'Add Timetable Entry', ~{::content})">
<section th:fragment="content" class="page-shell">

    <div class="pg-head">
        <h2><i class="fas fa-plus-circle" style="color:#4f46e5;"></i> Add Timetable Entry</h2>
        <p>Manually add a single slot to the timetable. For labs, select a batch.</p>
    </div>

    <div class="card">
        <form action="/save-timetable" method="post">

            <div class="form-grid">

                <!-- Day -->
                <div class="form-group">
                    <label>Day *</label>
                    <select name="day" required>
                        <option value="">Select day</option>
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                        <option>Saturday</option>
                    </select>
                </div>

                <!-- Time Slot -->
                <div class="form-group">
                    <label>Time Slot *</label>
                    <select name="timeSlot" required>
                        <option value="">Select slot</option>
                        <option th:each="t : ${times}"
                                th:value="${t.startTime + ' - ' + t.endTime}"
                                th:text="${t.startTime + ' – ' + t.endTime}">
                        </option>
                    </select>
                </div>

                <!-- Class -->
                <div class="form-group">
                    <label>Class *</label>
                    <select name="className" required>
                        <option value="">Select class</option>
                        <option th:each="cn : ${classOptions}" th:value="${cn}" th:text="${cn}"></option>
                    </select>
                </div>

                <!-- Batch (optional, for labs) -->
                <div class="form-group">
                    <label>Batch <span style="font-weight:400;text-transform:none;">(lab only)</span></label>
                    <select name="batch">
                        <option value="">— Whole class —</option>
                        <option th:each="b : ${batchOptions}" th:value="${b}" th:text="${b}"></option>
                    </select>
                    <p class="hint">Leave blank for theory lectures</p>
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label>Department *</label>
                    <select name="department" required>
                        <option value="">Select</option>
                        <option th:each="d : ${departments}" th:value="${d.name}" th:text="${d.name}"></option>
                    </select>
                </div>

                <!-- Subject -->
                <div class="form-group">
                    <label>Subject *</label>
                    <select name="subject" required>
                        <option value="">Select</option>
                        <option th:each="s : ${subjects}" th:value="${s.name}" th:text="${s.name}"></option>
                    </select>
                </div>

                <!-- Faculty -->
                <div class="form-group">
                    <label>Faculty *</label>
                    <select name="faculty" required>
                        <option value="">Select</option>
                        <option th:each="f : ${faculty}" th:value="${f.name}" th:text="${f.name}"></option>
                    </select>
                </div>

                <!-- Room -->
                <div class="form-group">
                    <label>Room *</label>
                    <select name="room" required>
                        <option value="">Select</option>
                        <option th:each="r : ${rooms}" th:value="${r.room}" th:text="${r.room}"></option>
                    </select>
                </div>

                <!-- Lecture Type -->
                <div class="form-group">
                    <label>Lecture Type *</label>
                    <select name="lectureType" required>
                        <option value="">Select</option>
                        <option value="Theory">Theory</option>
                        <option value="Practical">Practical</option>
                        <option value="Lab">Lab</option>
                        <option value="Tutorial">Tutorial</option>
                    </select>
                </div>

                <!-- Actions -->
                <div class="form-actions span-full">
                    <button type="submit" class="btn-pri">
                        <i class="fas fa-save"></i> Save Entry
                    </button>
                    <a href="/timetable-grid" class="btn-sec">
                        <i class="fas fa-arrow-left"></i> Back to Grid
                    </a>
                    <a href="/view-timetable" class="btn-sec">
                        <i class="fas fa-list"></i> Table View
                    </a>
                </div>

            </div>
        </form>
    </div>

</section>
</body>
</html>
