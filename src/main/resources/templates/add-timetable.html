<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin-layout :: head('Add Timetable · Admin', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell {
                display: flex;
                flex-direction: column;
                gap: 18px;
            }

            .page-header h2 {
                font-size: 26px;
                color: #0f172a;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .card {
                background: white;
                padding: 22px;
                border-radius: 14px;
                box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
                border: 1px solid #e2e8f0;
            }

            .form-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 14px 16px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .form-actions {
                display: flex;
                gap: 12px;
                margin-top: 14px;
                flex-wrap: wrap;
            }

            .helper {
                color: #6b7280;
                font-size: 13px;
            }
        </style>
    </th:block>
</head>
<body th:replace="admin-layout :: shell('timetable', 'Add Timetable', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div class="page-header">
        <h2><i class="fas fa-pen-to-square"></i> Add Timetable Entry</h2>
        <p class="helper">Create a single timetable row by choosing the slot, course, faculty, and room.</p>
    </div>

    <div class="card">
        <form action="/save-timetable" method="post" class="form-grid">
            <div class="form-group">
                <label>Day</label>
                <select name="day" required>
                    <option value="">Select day</option>
                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                    <option>Friday</option>
                    <option>Saturday</option>
                </select>
            </div>

            <div class="form-group">
                <label>Department</label>
                <select name="department" required>
                    <option value="">Select</option>
                    <option th:each="d : ${departments}" th:value="${d.name}" th:text="${d.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Class / Semester</label>
                <input type="text" name="className" placeholder="e.g., SE Computer" required>
            </div>

            <div class="form-group">
                <label>Division</label>
                <input type="text" name="division" placeholder="e.g., A / B" required>
            </div>

            <div class="form-group">
                <label>Subject</label>
                <select name="subject" required>
                    <option value="">Select</option>
                    <option th:each="s : ${subjects}" th:value="${s.name}" th:text="${s.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Faculty</label>
                <select name="faculty" required>
                    <option value="">Select</option>
                    <option th:each="f : ${faculty}" th:value="${f.name}" th:text="${f.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Room</label>
                <select name="room" required>
                    <option value="">Select</option>
                    <option th:each="r : ${rooms}" th:value="${r.room}" th:text="${r.room}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Lecture Type</label>
                <select name="lectureType" required>
                    <option value="">Select</option>
                    <option value="Theory">Theory</option>
                    <option value="Lab">Lab</option>
                    <option value="Tutorial">Tutorial</option>
                </select>
            </div>

            <div class="form-group">
                <label>Start Time</label>
                <input list="timeStarts" name="startTime" placeholder="09:00" required>
                <datalist id="timeStarts">
                    <option th:each="t : ${times}" th:value="${t.startTime}"></option>
                </datalist>
            </div>

            <div class="form-group">
                <label>End Time</label>
                <input list="timeEnds" name="endTime" placeholder="10:00" required>
                <datalist id="timeEnds">
                    <option th:each="t : ${times}" th:value="${t.endTime}"></option>
                </datalist>
            </div>

            <div class="form-group">
                <label>Break / Notes</label>
                <input type="text" name="breakTime" placeholder="e.g., Lunch / None" value="None">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn"><i class="fas fa-save"></i> Save Entry</button>
                <a href="/view-timetable" class="btn secondary" style="text-decoration:none;"><i class="fas fa-table"></i> View All</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
