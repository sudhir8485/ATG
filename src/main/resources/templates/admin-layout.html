<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle, extraHead)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Admin · Timetable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-start: #0f172a;
            --sidebar-end: #1e293b;
            --primary: #4f46e5;
            --primary-soft: rgba(99, 102, 241, 0.22);
            --bg: #f0f3fa;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Keep labels above inputs to avoid overlap with field text */
        .form-group label,
        label.floating-label {
            position: static;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            transform: none;
            transition: none;
        }

        .app-sidebar {
            width: 270px;
            background: linear-gradient(180deg, var(--sidebar-start) 0%, var(--sidebar-end) 82%);
            color: #e2e8f0;
            padding: 26px 18px;
            box-shadow: 8px 0 20px rgba(0, 0, 0, 0.18);
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.2px;
        }

        .app-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            transition: all 0.18s ease;
            border: 1px solid transparent;
        }

        .app-nav a:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(129, 140, 248, 0.35);
            color: #fff;
        }

        .app-nav a.active {
            background: var(--primary-soft);
            border-left: 4px solid var(--primary);
            color: #fff;
            font-weight: 600;
        }

        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 22px 26px;
            gap: 18px;
            overflow: hidden;
        }

        .app-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.92);
            padding: 14px 20px;
            border-radius: 26px;
            box-shadow: 0 10px 25px -12px rgba(0, 0, 0, 0.18);
            border: 1px solid var(--border);
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-title h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .app-badge {
            background: #0f172a;
            color: #fff;
            padding: 10px 16px;
            border-radius: 24px;
            font-weight: 600;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 10px;
        }

        .content-card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            background: var(--primary);
            color: #fff;
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 30px rgba(79, 70, 229, 0.24);
        }

        .btn.secondary {
            background: #e5e7eb;
            color: #1f2937;
            box-shadow: none;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eef2ff;
            color: #4338ca;
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
        }

        label {
            font-weight: 600;
            color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 14px;
            text-align: left;
        }

        th {
            background: #f7f9fc;
            color: #475569;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.4px;
        }

        tr {
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: #f9fafb;
        }

        @media (max-width: 960px) {
            body {
                flex-direction: column;
            }
            .app-sidebar {
                position: relative;
                height: auto;
                width: auto;
                border-radius: 0 0 20px 20px;
            }
            .app-main {
                padding: 16px;
            }
            .app-topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    <th:block th:if="${extraHead}" th:insert="${extraHead}"></th:block>
</head>
<body th:fragment="shell(activePage, pageTitle, content)">
    <aside class="app-sidebar">
        <div class="app-brand"><i class="fas fa-crown"></i> Admin</div>
        <nav class="app-nav">
            <a href="/admin" th:classappend="${activePage}=='dashboard' ? 'active'">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="/add-department" th:classappend="${activePage}=='departments' ? 'active'">
                <i class="fas fa-building"></i> Departments
            </a>
            <a href="/add-division" th:classappend="${activePage}=='divisions' ? 'active'">
                <i class="fas fa-layer-group"></i> Divisions
            </a>
            <a href="/add-subject" th:classappend="${activePage}=='subjects' ? 'active'">
                <i class="fas fa-book-open"></i> Subjects
            </a>
            <a href="/assign-subjects" th:classappend="${activePage}=='assign-subjects' ? 'active'">
                <i class="fas fa-link"></i> Assign Subjects
            </a>
            <a href="/add-classroom" th:classappend="${activePage}=='classrooms' ? 'active'">
                <i class="fas fa-door-open"></i> Classrooms
            </a>
            <a href="/add-timeslot" th:classappend="${activePage}=='timeslots' ? 'active'">
                <i class="fas fa-clock"></i> Time Slots
            </a>
            <a href="/add-hod" th:classappend="${activePage}=='hod' ? 'active'">
                <i class="fas fa-user-tie"></i> Add HOD
            </a>
            <a href="/add-faculty" th:classappend="${activePage}=='faculty' ? 'active'">
                <i class="fas fa-chalkboard-teacher"></i> Add Faculty
            </a>
            <!-- Add Timetable link removed per request -->
            <a href="/auto-generate" th:classappend="${activePage}=='generate' ? 'active'">
                <i class="fas fa-magic"></i> Generate Timetable
            </a>
            <a href="/view-timetable" th:classappend="${activePage}=='view' ? 'active'">
                <i class="fas fa-calendar-alt"></i> View Timetable
            </a>
            <a href="/timetable-grid" th:classappend="${activePage}=='grid' ? 'active'">
                <i class="fas fa-table"></i> Weekly Grid
            </a>
            <a href="/"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <div class="app-main">
        <header class="app-topbar">
            <div class="app-title">
                <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:#eef2ff;color:var(--primary);">
                    <i class="fas fa-calendar-check"></i>
                </span>
                <div>
                    <p style="margin:0;color:#475569;font-weight:600;font-size:13px;">Automatic Timetable Generator</p>
                    <h1 th:text="${pageTitle}">Dashboard</h1>
                </div>
            </div>
            <span class="app-badge">
                <i class="fas fa-user-shield"></i>
                <span>ADMIN · <span id="currentDate"></span></span>
            </span>
        </header>

        <main class="app-content" id="page-content" th:insert="${content}"></main>
    </div>

    <script>
        (function setDateBadge() {
            const el = document.getElementById('currentDate');
            if (!el) return;
            const date = new Date();
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            el.textContent = date.toLocaleDateString(undefined, options);
        })();
    </script>
</body>
</html>
