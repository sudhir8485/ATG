<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle, extraHead)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${pageTitle}">Admin · Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
	--sidebar-start: #0f172a;
	--sidebar-end: #1e293b;
	--primary: #4f46e5;
	--primary-soft: rgba(99, 102, 241, 0.22);
	--bg: #f0f3fa;
	--card: #ffffff;
	--text: #0f172a;
	--muted: #475569;
	--border: #e2e8f0;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	display: flex;
	min-height: 100vh;
	background: var(--bg);
	font-family: 'Inter', 'Segoe UI', sans-serif;
	color: var(--text);
}

a {
	color: inherit;
	text-decoration: none;
}

/* Keep labels above inputs to avoid overlap with field text */
.form-group label, label.floating-label {
	position: static;
	display: block;
	margin-bottom: 6px;
	font-weight: 600;
	transform: none;
	transition: none;
}

.app-sidebar {
	width: 270px;
	background: linear-gradient(180deg, var(--sidebar-start) 0%,
		var(--sidebar-end) 82%);
	color: #e2e8f0;
	padding: 26px 18px 16px;
	box-shadow: 8px 0 20px rgba(0, 0, 0, 0.18);
	position: sticky;
	top: 0;
	height: 100vh;
	display: flex;
	flex-direction: column;
	gap: 8px;
	overflow: hidden;
}

.app-brand {
	display: flex;
	align-items: center;
	gap: 10px;
	font-size: 20px;
	font-weight: 700;
	margin-bottom: 10px;
	letter-spacing: 0.2px;
	flex-shrink: 0;
}

.app-nav {
	display: flex;
	flex-direction: column;
	gap: 4px;
	flex: 1;
	overflow-y: auto;
	min-height: 0;
	padding-right: 2px;
}

.app-nav::-webkit-scrollbar { width: 4px; }
.app-nav::-webkit-scrollbar-track { background: transparent; }
.app-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }
.app-nav::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }

.app-nav a {
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 12px 14px;
	border-radius: 14px;
	transition: all 0.18s ease;
	border: 1px solid transparent;
}

.app-nav a:hover {
	background: rgba(255, 255, 255, 0.08);
	border-color: rgba(129, 140, 248, 0.35);
	color: #fff;
}

.app-nav a.active {
	background: var(--primary-soft);
	border-left: 4px solid var(--primary);
	color: #fff;
	font-weight: 600;
}

.app-main {
	flex: 1;
	display: flex;
	flex-direction: column;
	padding: 22px 26px;
	gap: 18px;
	overflow: hidden;
}

.app-topbar {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 12px;
	background: rgba(255, 255, 255, 0.92);
	padding: 14px 20px;
	border-radius: 26px;
	box-shadow: 0 10px 25px -12px rgba(0, 0, 0, 0.18);
	border: 1px solid var(--border);
}

.app-title {
	display: flex;
	align-items: center;
	gap: 12px;
}

.app-title h1 {
	font-size: 20px;
	font-weight: 700;
}

.app-badge {
	background: #0f172a;
	color: #fff;
	padding: 10px 16px;
	border-radius: 24px;
	font-weight: 600;
	letter-spacing: 0.2px;
	display: inline-flex;
	align-items: center;
	gap: 6px;
}

.app-content {
	flex: 1;
	overflow-y: auto;
	padding-bottom: 10px;
}

.content-card {
	background: var(--card);
	border-radius: 18px;
	padding: 20px;
	box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.2);
	border: 1px solid var(--border);
}

.btn {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	padding: 12px 16px;
	border-radius: 12px;
	border: none;
	cursor: pointer;
	font-weight: 700;
	background: var(--primary);
	color: #fff;
	box-shadow: 0 12px 24px rgba(79, 70, 229, 0.2);
	transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.btn:hover {
	transform: translateY(-1px);
	box-shadow: 0 16px 30px rgba(79, 70, 229, 0.24);
}

.btn.secondary {
	background: #e5e7eb;
	color: #1f2937;
	box-shadow: none;
}

.pill {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background: #eef2ff;
	color: #4338ca;
	padding: 6px 12px;
	border-radius: 999px;
	font-weight: 700;
	font-size: 12px;
}

input, select, textarea {
	width: 100%;
	padding: 8px 12px;
	border: 1px solid var(--border);
	border-radius: 8px;
	font-size: 13px;
	background: #fff;
	color: #1e293b;
	transition: border-color .15s, box-shadow .15s;
}

input:focus, select:focus, textarea:focus {
	outline: none;
	border-color: var(--primary);
	box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
}

label {
	font-weight: 600;
	color: #1e293b;
}

table {
	width: 100%;
	border-collapse: collapse;
}

th, td {
	padding: 10px 12px;
	text-align: left;
}

th {
	background: #f8fafc;
	color: #64748b;
	text-transform: uppercase;
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 0.5px;
	border-bottom: 1px solid var(--border);
	white-space: nowrap;
}

td {
	border-bottom: 1px solid #f1f5f9;
	vertical-align: middle;
	font-size: 13px;
}

tr { background: #fff; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fafb; }

/* ═══ GLOBAL DESIGN SYSTEM ═══════════════════════════════════════ */

/* Page header */
.pg-head       { display:flex; flex-direction:column; gap:2px; }
.pg-head h2    { margin:0; font-size:22px; font-weight:800; color:#1e293b; display:flex; align-items:center; gap:10px; }
.pg-head p     { margin:0; font-size:13px; color:#64748b; }

/* Stat cards */
.stat-row      { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
.stat-card     { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px 18px;
                 box-shadow:0 2px 6px rgba(0,0,0,0.05); display:flex; align-items:center; gap:14px; }
.stat-icon     { width:44px; height:44px; background:#eef2ff; border-radius:10px;
                 display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:18px; flex-shrink:0; }
.stat-icon.green  { background:#f0fdf4; color:#059669; }
.stat-icon.amber  { background:#fffbeb; color:#d97706; }
.stat-icon.red    { background:#fef2f2; color:#dc2626; }
.stat-info .sv { font-size:26px; font-weight:800; color:#1e293b; line-height:1; }
.stat-info .sl { font-size:11px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:0.4px; margin-top:4px; }

/* Consistent card */
.ds-card       { background:#fff; border:1px solid var(--border); border-radius:12px;
                 box-shadow:0 2px 8px rgba(0,0,0,0.06); padding:20px; }
.ds-card-head  { font-size:14px; font-weight:700; color:#1e293b; display:flex; align-items:center; gap:8px;
                 padding-bottom:14px; margin-bottom:16px; border-bottom:1px solid #f1f5f9; }
.ds-list       { background:#fff; border:1px solid var(--border); border-radius:12px;
                 box-shadow:0 2px 8px rgba(0,0,0,0.06); overflow:hidden; }
.ds-list-head  { padding:14px 16px; border-bottom:1px solid var(--border); display:flex;
                 align-items:center; justify-content:space-between; background:#f8fafc; }
.ds-list-head h4 { margin:0; font-size:13px; font-weight:700; color:#1e293b; display:flex; align-items:center; gap:6px; }
.count-tag     { background:var(--primary); color:#fff; border-radius:999px; font-size:11px; font-weight:700; padding:2px 8px; }

/* Form group */
.fg            { margin-bottom:14px; }
.fg label, .fl { display:block; font-size:11px; font-weight:700; color:#64748b;
                 text-transform:uppercase; letter-spacing:0.3px; margin-bottom:5px; }
.fg .hint      { font-size:11px; color:#94a3b8; margin-top:3px; }

/* Buttons — primary */
.btn-pri { padding:8px 18px; border-radius:8px; border:none; background:var(--primary); color:#fff;
           cursor:pointer; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px; transition:background .15s; }
.btn-pri:hover { background:#4338ca; }

/* Buttons — secondary / cancel */
.btn-sec { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:#f8fafc;
           color:#475569; cursor:pointer; font-weight:600; font-size:13px;
           display:inline-flex; align-items:center; gap:6px; text-decoration:none; transition:background .15s; }
.btn-sec:hover { background:#f1f5f9; }

/* Buttons — small table actions */
.tbl-edit { padding:5px 10px; border-radius:6px; border:1px solid #e0e7ff; background:#eef2ff;
            color:#4338ca; font-weight:600; font-size:12px; display:inline-flex; align-items:center; gap:4px; text-decoration:none; }
.tbl-edit:hover { background:#e0e7ff; }
.tbl-del  { padding:5px 10px; border-radius:6px; border:1px solid #fecaca; background:#fef2f2;
            color:#dc2626; font-weight:600; font-size:12px; display:inline-flex; align-items:center; gap:4px; text-decoration:none; }
.tbl-del:hover  { background:#fee2e2; }
.tbl-actions { display:flex; gap:6px; align-items:center; }

/* Flash messages */
.flash-ok   { padding:10px 16px; border-radius:8px; font-size:13px; background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }
.flash-err  { padding:10px 16px; border-radius:8px; font-size:13px; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
.flash-warn { padding:10px 16px; border-radius:8px; font-size:13px; background:#fffbeb; color:#92400e; border:1px solid #fde68a; }

/* Edit banner */
.edit-banner { background:#fffbeb; border:1px solid #fcd34d; border-left:3px solid #f59e0b;
               border-radius:8px; padding:10px 14px; margin-bottom:14px; color:#92400e; font-size:13px; font-weight:600; }

/* Content two-column grid */
.pg-grid     { display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
@media(max-width:900px) { .pg-grid { grid-template-columns:1fr; } }

/* Day pills for tables */
.day-mon { color:#1d4ed8; font-weight:700; }
.day-tue { color:#059669; font-weight:700; }
.day-wed { color:#d97706; font-weight:700; }
.day-thu { color:#7c3aed; font-weight:700; }
.day-fri { color:#dc2626; font-weight:700; }

/* Type pills */
.tp { display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; }
.tp-theory     { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
.tp-practical  { background:#fdf4ff; color:#7e22ce; border:1px solid #e9d5ff; }
.tp-lab        { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
.tp-special    { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
.tp-audit      { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }
.tp-default    { background:#f8fafc; color:#475569; border:1px solid var(--border); }

@media ( max-width : 960px) {
	body {
		flex-direction: column;
	}
	.app-sidebar {
		position: relative;
		height: auto;
		width: auto;
		overflow: visible;
		border-radius: 0 0 20px 20px;
	}
	.app-nav {
		overflow-y: visible;
		flex: none;
	}
	.app-main {
		padding: 16px;
	}
	.app-topbar {
		flex-direction: column;
		align-items: flex-start;
	}
}
</style>
<th:block th:if="${extraHead}" th:insert="${extraHead}"></th:block>
</head>
<body th:fragment="shell(activePage, pageTitle, content)">
	<aside class="app-sidebar">
		<div class="app-brand">
			<i class="fas fa-crown"></i> Admin
		</div>
		<nav class="app-nav">
			<a href="/admin"
				th:classappend="${activePage}=='dashboard' ? 'active'"> <i
				class="fas fa-chart-pie"></i> Dashboard
			</a> <a href="/add-department"
				th:classappend="${activePage}=='departments' ? 'active'"> <i
				class="fas fa-building"></i> Departments
			</a> <a href="/add-division"
				th:classappend="${activePage}=='divisions' ? 'active'"> <i
				class="fas fa-layer-group"></i> Divisions
			</a> <a href="/add-classroom"
				th:classappend="${activePage}=='classrooms' ? 'active'"> <i
				class="fas fa-door-open"></i> Classrooms
			</a> <a href="/add-timeslot"
				th:classappend="${activePage}=='timeslots' ? 'active'"> <i
				class="fas fa-clock"></i> Time Slots
			</a> <a href="/add-subject"
				th:classappend="${activePage}=='subjects' ? 'active'"> <i
				class="fas fa-book-open"></i> Subjects
			</a> <a href="/add-faculty"
				th:classappend="${activePage}=='faculty' ? 'active'"> <i
				class="fas fa-chalkboard-teacher"></i> Add Faculty
			</a> <a href="/assign-subjects"
				th:classappend="${activePage}=='assign-subjects' ? 'active'"> <i
				class="fas fa-link"></i> Assign Subjects
			</a> <a href="/add-hod" th:classappend="${activePage}=='hod' ? 'active'">
				<i class="fas fa-user-tie"></i> Add HOD
			</a> <a href="/auto-generate"
				th:classappend="${activePage}=='generate' ? 'active'"> <i
				class="fas fa-magic"></i> Generate Timetable
			</a> <a href="/view-timetable"
				th:classappend="${activePage}=='view' ? 'active'"> <i
				class="fas fa-calendar-alt"></i> View Timetable
			</a> <a href="/timetable-grid"
				th:classappend="${activePage}=='grid' ? 'active'"> <i
				class="fas fa-table"></i> Weekly Grid
			</a> <a href="/recycle-bin"
				th:classappend="${activePage}=='recycle' ? 'active'"> <i
				class="fas fa-trash-restore"></i> Recycle Bin
			</a> <a href="/institution-settings"
				th:classappend="${activePage}=='institution' ? 'active'"> <i
				class="fas fa-university"></i> Institution Settings
			</a> <a href="/how-to-use"
				th:classappend="${activePage}=='howto' ? 'active'"> <i
				class="fas fa-book-open"></i> How to Use
			</a> <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout
			</a>
			<form action="/shutdown-server" method="post" style="margin:0"
			      onsubmit="return confirm('Stop the ATG server? The browser tab will close.')">
				<input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
				<button type="submit" style="width:100%;background:none;border:none;cursor:pointer;padding:10px 14px;text-align:left;color:#f87171;font-size:inherit;display:flex;align-items:center;gap:8px;border-radius:8px;transition:background .2s"
				        onmouseover="this.style.background='rgba(248,113,113,.15)'" onmouseout="this.style.background='none'">
					<i class="fas fa-power-off"></i> Stop Server
				</button>
			</form>
		</nav>
	</aside>

	<div class="app-main">
		<header class="app-topbar">
			<div class="app-title">
				<span
					style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: #eef2ff; color: var(--primary);">
					<i class="fas fa-calendar-check"></i>
				</span>
				<div>
					<p
						style="margin: 0; color: #475569; font-weight: 600; font-size: 13px;">Automatic
						Timetable Generator</p>
					<h1 th:text="${pageTitle}">Dashboard</h1>
				</div>
			</div>
			<span class="app-badge"> <i class="fas fa-user-shield"></i> <span>ADMIN
					· <span id="currentDate"></span>
			</span>
			</span>
		</header>

		<main class="app-content" id="page-content" th:insert="${content}"></main>
	</div>

	<script>
		(function setDateBadge() {
			const el = document.getElementById('currentDate');
			if (!el)
				return;
			const date = new Date();
			const options = {
				year : 'numeric',
				month : 'short',
				day : 'numeric'
			};
			el.textContent = date.toLocaleDateString(undefined, options);
		})();
	</script>
</body>
</html>
