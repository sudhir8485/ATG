<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin-layout :: head('View Timetable · Admin', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .card {
                background: #fff;
                border-radius: 14px;
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
                padding: 18px;
                border: 1px solid #e2e8f0;
            }

            .card header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 10px;
            }

            .label-pill {
                background: #eef2ff;
                color: #4338ca;
                padding: 6px 12px;
                border-radius: 12px;
                font-weight: 700;
                font-size: 12px;
            }
        </style>
    </th:block>
</head>
<body th:replace="admin-layout :: shell('view', 'View Timetable', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div class="card">
        <header>
            <div>
                <h2 style="margin:0;">All Timetable Entries</h2>
                <p style="color:#64748b;margin:4px 0 0;">Manage and prune generated or manual slots.</p>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <form method="get" action="/view-timetable" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <select name="department" style="padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;">
                        <option value="">All Departments</option>
                        <option th:each="d : ${deptList}" th:value="${d}" th:text="${d}" th:selected="${selectedDept != null} ? (d == selectedDept) : false"></option>
                    </select>
                    <select name="className" style="padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;">
                        <option value="">All Classes</option>
                        <option th:each="c : ${classList}" th:value="${c}" th:text="${c}" th:selected="${selectedClass != null} ? (c == selectedClass) : false"></option>
                    </select>
                    <button class="btn secondary" type="submit">Apply</button>
                    <a class="btn secondary" href="/view-timetable" style="text-decoration:none;">Clear</a>
                </form>
                <a class="btn" href="#" onclick="exportWithFilters('/export-pdf');return false;" style="text-decoration:none;">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </a>
                <a class="btn secondary" href="#" onclick="exportWithFilters('/export-load-distribution');return false;" style="text-decoration:none;">
                    <i class="fas fa-file-alt"></i> Load Distribution PDF
                </a>
                <a class="btn secondary" href="/auto-generate" style="text-decoration:none;"><i class="fas fa-magic"></i> Auto Generate</a>
                <form action="/clear-timetable" method="post" style="display:inline;">
                    <button class="btn secondary" type="submit" style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;">Clear Timetable</button>
                </form>
            </div>
        </header>

        <div th:if="${message}" th:text="${message}"
             th:classappend="${messageType}=='success' ? 'alert-success' : 'alert-error'"
             style="margin-bottom:12px;padding:10px 14px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a;font-weight:600;">
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Class</th>
                    <th>Division</th>
                    <th>Subject</th>
                    <th>Faculty</th>
                    <th>Room</th>
                    <th>Type</th>
                    <th>Break/Note</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${timetableList}">
                    <td th:text="${t.day}"></td>
                    <td th:text="${t.timeSlot}"></td>
                    <td th:text="${t.className}"></td>
                    <td th:text="${t.division}"></td>
                    <td th:text="${t.subject}"></td>
                    <td th:text="${t.faculty}"></td>
                    <td th:text="${t.room}"></td>
                    <td><span class="label-pill" th:text="${t.lectureType}"></span></td>
                    <td th:text="${t.breakTime}"></td>
                    <td>
                        <a th:href="@{/delete-timetable/{id}(id=${t.id})}"
                           onclick="return confirm('Delete this timetable entry?')"
                           style="color:#e11d48;text-decoration:none;font-weight:700;">
                            <i class="fas fa-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(timetableList)}">
                    <td colspan="10" style="text-align:center;padding:14px;color:#6b7280;">No timetable entries yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        function exportWithFilters(baseUrl){
            const deptSelect = document.querySelector('select[name=\"department\"]');
            const classSelect = document.querySelector('select[name=\"className\"]');
            const dept = deptSelect ? deptSelect.value : '';
            const cls = classSelect ? classSelect.value : '';
            const params = new URLSearchParams();
            if(dept) params.append('department', dept);
            if(cls) params.append('className', cls);
            const url = baseUrl + (params.toString() ? '?' + params.toString() : '');
            window.open(url, '_blank');
        }
    </script>
</section>
</body>
</html>
