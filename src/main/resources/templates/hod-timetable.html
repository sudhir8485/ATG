<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="hod-layout :: head('Department Timetable · HOD', ~{::extraHead})">
    <th:block th:fragment="extraHead">
        <style>
            .page-shell{display:flex;flex-direction:column;gap:16px;}
            table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px -16px rgba(0,0,0,0.18);}
            th,td{padding:12px 10px;border-bottom:1px solid #e2e8f0;text-align:left;}
            th{background:#f8fafc;text-transform:uppercase;font-size:12px;letter-spacing:0.3px;color:#475569;}
            .filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
            select{padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;}
            .btn{padding:8px 12px;border-radius:8px;border:none;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;}
            .btn.secondary{background:#e5e7eb;color:#111827;text-decoration:none;}
        </style>
    </th:block>
</head>
<body th:replace="hod-layout :: shell('timetable', 'Department Timetable', ~{::content})">
<section th:fragment="content" class="page-shell">
    <div class="filter-row">
        <form method="get" action="/hod-timetable" style="display:flex;gap:10px;align-items:center;">
            <select name="className">
                <option value="">All Classes</option>
                <option th:each="c : ${classList}" th:value="${c}" th:text="${c}" th:selected="${selectedClass != null} ? (c == selectedClass) : false"></option>
            </select>
            <button class="btn" type="submit">Apply</button>
            <a class="btn secondary" href="/hod-timetable">Clear</a>
        </form>
    </div>

    <table>
        <thead>
        <tr><th>Day</th><th>Class</th><th>Division</th><th>Subject</th><th>Faculty</th><th>Time</th><th>Room</th></tr>
        </thead>
        <tbody>
        <tr th:each="t : ${timetableList}">
            <td th:text="${t.day}"></td>
            <td th:text="${t.className}"></td>
            <td th:text="${t.division}"></td>
            <td th:text="${t.subject}"></td>
            <td th:text="${t.faculty}"></td>
            <td th:text="${t.timeSlot}"></td>
            <td th:text="${t.room}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(timetableList)}">
            <td colspan="7" style="text-align:center;padding:12px;color:#6b7280;">No timetable entries.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
