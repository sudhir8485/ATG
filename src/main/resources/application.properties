spring.datasource.url=jdbc:postgresql://localhost:5432/atg
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Run data.sql only for embedded dbs (prevents wiping real MySQL data on restart)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Thymeleaf: use classpath templates; disable cache for fast reload in dev
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=false


