spring.datasource.url=jdbc:h2:file:${user.home}/.atg/atg-data;DATABASE_TO_UPPER=FALSE
spring.datasource.username=atg-data
spring.datasource.password=atgadmin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=false

# H2 console servlet is registered manually in H2ConsoleConfig.java (Spring Boot 4 removed auto-config)
