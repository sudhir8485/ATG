# ─── Production profile — used by the packaged .exe / .deb installer ───────────
# H2 file-based database stored in the user's home directory.
# On Windows: C:\Users\<user>\.atg\atg.mv.db
# On Linux:   /home/<user>/.atg/atg.mv.db
# H2 creates the directory automatically on first run.

spring.datasource.url=jdbc:h2:file:~/.atg/atg;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=atg-data
spring.datasource.password=atgadmin

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=true

# DevTools must be off in packaged app
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

server.port=8765
