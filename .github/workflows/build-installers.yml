name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fat JAR
        shell: bash
        run: ./mvnw package -DskipTests -q

      - name: Create Windows installer
        shell: bash
        run: |
          mkdir -p dist
          jpackage \
            --input target \
            --main-jar AutomatedTimetable-1.0.0.jar \
            --name "ATG" \
            --app-version "1.0.0" \
            --vendor "APCOER IT Dept" \
            --description "Automated Timetable Generator" \
            --copyright "2025 APCOER" \
            --icon src/main/jpackage/atg-icon.ico \
            --type exe \
            --dest dist \
            --win-dir-chooser \
            --win-shortcut \
            --win-shortcut-prompt \
            --win-menu \
            --win-menu-group "APCOER" \
            --win-upgrade-uuid "c7a2f8e1-4b3d-4e9a-8f2c-1d5e6a7b8c9d" \
            --java-options "-Dspring.profiles.active=prod" \
            --java-options "-Xverify:none" \
            --java-options "-XX:TieredStopAtLevel=1" \
            --java-options "-Xshare:off" \
            --java-options "-Xmx512m"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ATG-Windows-Installer
          path: dist/*.exe

  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fat JAR
        run: ./mvnw package -DskipTests -q

      - name: Create Linux installer
        run: |
          mkdir -p dist
          jpackage \
            --input target \
            --main-jar AutomatedTimetable-1.0.0.jar \
            --name "ATG" \
            --app-version "1.0.0" \
            --vendor "APCOER IT Dept" \
            --description "Automated Timetable Generator — APCOER IT Department" \
            --copyright "2025 APCOER" \
            --icon src/main/jpackage/atg-icon.png \
            --type deb \
            --dest dist \
            --linux-shortcut \
            --linux-app-category "Education" \
            --linux-deb-maintainer "sudhirdhawade05@gmail.com" \
            --java-options "-Dspring.profiles.active=prod" \
            --java-options "-Xverify:none" \
            --java-options "-XX:TieredStopAtLevel=1" \
            --java-options "-Xshare:off" \
            --java-options "-Xmx512m" \
            --java-options "-Djava.awt.headless=false"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: ATG-Linux-Installer
          path: dist/*.deb

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ATG-Windows-Installer
          path: artifacts/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: ATG-Linux-Installer
          path: artifacts/linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ATG ${{ github.ref_name }}
          body: |
            ## ATG — Automated Timetable Generator
            **APCOER, Parvati, Pune — IT Department**

            ### Installation
            - **Windows**: Download `ATG-1.0.0.exe` and run the installer. No Java required — JRE is bundled.
            - **Linux (Ubuntu/Debian)**: Download `atg_1.0.0_amd64.deb` and run:
              ```
              sudo dpkg -i atg_1.0.0_amd64.deb
              ```

            ### First Run
            The app starts a local server and opens automatically in your browser at **http://localhost:8765**

            Login credentials:
            - Username: `apcoer`  |  Password: `atg`  |  Role: `ADMIN`

            ### Database
            Data is stored at `~/.atg/atg.mv.db` (H2 embedded — no external database needed).
          files: |
            artifacts/windows/*.exe
            artifacts/linux/*.deb
