name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fat JAR
        shell: bash
        run: ./mvnw package -DskipTests

      - name: Create Windows installer
        shell: bash
        run: |
          mkdir -p dist
          jpackage \
            --input target \
            --main-jar AutomatedTimetable-0.0.1-SNAPSHOT.jar \
            --name "ATG" \
            --app-version "1.0.0" \
            --vendor "APCOER IT Dept" \
            --description "Automated Timetable Generator" \
            --icon src/main/jpackage/atg-icon.ico \
            --type exe \
            --dest dist \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --win-menu-group "ATG"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ATG-Windows-Installer
          path: dist/*.exe

  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fat JAR
        run: ./mvnw package -DskipTests

      - name: Create Linux installer
        run: |
          mkdir -p dist
          jpackage \
            --input target \
            --main-jar AutomatedTimetable-0.0.1-SNAPSHOT.jar \
            --name "atg" \
            --app-version "1.0.0" \
            --vendor "APCOER IT Dept" \
            --description "Automated Timetable Generator" \
            --icon src/main/jpackage/atg-icon.png \
            --type deb \
            --dest dist \
            --linux-shortcut \
            --linux-app-category "Education"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: ATG-Linux-Installer
          path: dist/*.deb

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ATG-Windows-Installer
          path: artifacts/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: ATG-Linux-Installer
          path: artifacts/linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ATG ${{ github.ref_name }}
          body: |
            ## ATG — Automated Timetable Generator

            ### Installation
            - **Windows**: Download and run `ATG-1.0.0.exe`
            - **Linux (Ubuntu/Debian)**: Download `atg_1.0.0_amd64.deb` and run `sudo dpkg -i atg_1.0.0_amd64.deb`

            ### First Run
            The app opens automatically in your browser at `http://localhost:8080`
            Login with your admin credentials.
          files: |
            artifacts/windows/*.exe
            artifacts/linux/*.deb
